name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual runs and a scheduled weekly run to keep pre-commit hooks up-to-date
  workflow_dispatch: {}
  #schedule:
  #  # Weekly on Sunday at 03:00 UTC
  #  - cron: '0 3 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml','uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies with uv
        run: |
          # Sync project environment from pyproject.toml / uv.lock
          uv sync
          # Ensure pip and CI tools exist inside the uv environment; if these tools are
          # declared as dev dependencies in pyproject.toml, this is redundant and can be removed.
          uv run pip install --upgrade pip
          uv run pip install ruff pytest-cov coverage

      - name: Lint
        run: |
          uv run ruff check . --line-length 120

      - name: Run tests with coverage
        run: |
          # Run tests with coverage and fail if coverage below 100%
          uv run pytest -q --cov=src --cov-report=term-missing --cov-fail-under=100 tests

  # Periodic job to run `pre-commit autoupdate` and open a PR if hooks changed
  autoupdate-precommit:
    name: Autoupdate pre-commit hooks
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history so the action can create a branch/PR
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit autoupdate
        run: |
          pre-commit autoupdate --freeze

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files || true

      - name: Create Pull Request if changes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: autoupdate pre-commit hooks"
          branch: "autoupdate/pre-commit-hooks-${{ github.run_id }}"
          title: "chore: autoupdate pre-commit hooks"
          body: |
            This PR was created automatically by the scheduled CI job to update pre-commit hooks
            and related configurations. Please review and merge if acceptable.
          labels: autoupdate
