assistant:
  # Lint command ( Ruff )
  lint: "uv run ruff check ."
  # Format command ( Ruff format )
  format: "uv run ruff format ."
  # Type-Check Command (MyPy)
  # Run with the config in pyproject.toml ([tool.mypy] files)
  type-check: "uv run mypy"
  # Explicit alternative that checks src and tests (avoids duplicate-module issues)
  type-check-src-tests: "uv run mypy --strict src tests"
  # Test command (PyTest)
  test: "uv run pytest -q"
  # Test Coverage command (PyTest + Coverage)
  test-coverage: "uv run pytest --cov=src --cov-report=term-missing -q"
  # Install dev tools locally (UV)
  dev_requirements: "uv sync"
  # Notes to the assistant
  note: "Follow these commands unless explicitly told otherwise in the prompt."
